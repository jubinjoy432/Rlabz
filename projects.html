<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Repository - RLabz</title>
    <meta name="description" content="Explore the complete portfolio of projects developed under RLabz — web applications, mobile apps, and platforms built by students and faculty.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&family=Space+Grotesk:wght@300;500;700&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="projects-page.css">
</head>

<body>
    <!-- Premium Floating Navbar -->
    <nav class="premium-nav">
        <div class="nav-content">
            <a href="index.html" class="nav-logo">
                <span class="brand-icon">
                    <img src="images/rz-logo.webp" alt="RLabz Logo" class="logo-image">
                </span>
                <span class="brand-text"><span class="brand-green">R</span><span class="brand-blue">LabZ</span></span>
            </a>
            <div class="nav-links-container">
                <span class="sliding-pill"></span>
                <a href="index.html#hero-blue" class="nav-link">Home</a>
                <a href="index.html#what-we-do" class="nav-link">Solutions</a>
                <a href="projects.html" class="nav-link active">Projects</a>
                <a href="index.html#client_form_section" class="nav-link">Clients</a>
            </div>

            <div class="nav-actions">
                <a href="index.html#contactSection" class="nav-contact-btn">
                    Contact Us <span class="nav-dot"></span>
                </a>
                <button class="menu-toggle-btn">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M4 9H20" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
                        <path d="M4 15H20" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
                    </svg>
                </button>
            </div>
        </div>
    </nav>

    <!-- Projects Page Content -->
    <div class="projects-page-wrapper">

        <!-- Page Hero -->
        <section class="projects-hero">
            <div class="projects-hero-badge">
                <i class="fa-solid fa-folder-open"></i>
                Project Repository
            </div>
            <h1>Explore Our <span>Projects</span></h1>
            <p class="projects-hero-subtitle">
                Discover the complete portfolio of innovative projects built under RLabz —
                from web platforms and mobile apps to enterprise solutions.
            </p>
        </section>

        <!-- Search & Filters -->
        <div class="projects-filter-bar">
            <div class="projects-search-row">
                <div class="projects-search-wrapper">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="projectsSearchInput" class="projects-search-input"
                        placeholder="Search by project title, student name, technology, or year...">
                    <button id="projectsSearchClear" class="projects-search-clear" aria-label="Clear search">&times;</button>
                </div>
            </div>

            <div class="projects-filter-row">
                <span class="filter-label">Filter by</span>

                <!-- Year Filter -->
                <div class="filter-dropdown">
                    <button class="filter-dropdown-btn" type="button">
                        <i class="fa-regular fa-calendar"></i> Year <i class="fa-solid fa-chevron-down"></i>
                    </button>
                    <div class="filter-dropdown-menu" id="yearFilterMenu"></div>
                </div>

                <!-- Technology Filter -->
                <div class="filter-dropdown">
                    <button class="filter-dropdown-btn" type="button">
                        <i class="fa-solid fa-code"></i> Technology <i class="fa-solid fa-chevron-down"></i>
                    </button>
                    <div class="filter-dropdown-menu" id="techFilterMenu"></div>
                </div>

                <!-- Category Filter -->
                <div class="filter-dropdown">
                    <button class="filter-dropdown-btn" type="button">
                        <i class="fa-solid fa-layer-group"></i> Category <i class="fa-solid fa-chevron-down"></i>
                    </button>
                    <div class="filter-dropdown-menu" id="categoryFilterMenu"></div>
                </div>

                <!-- Status Filter -->
                <div class="filter-dropdown">
                    <button class="filter-dropdown-btn" type="button">
                        <i class="fa-solid fa-circle-check"></i> Status <i class="fa-solid fa-chevron-down"></i>
                    </button>
                    <div class="filter-dropdown-menu" id="statusFilterMenu"></div>
                </div>
            </div>

            <!-- Active Filters -->
            <div class="active-filters" id="activeFiltersContainer"></div>
        </div>

        <!-- Results Info -->
        <div class="projects-results-info">
            <div class="projects-count" id="projectsResultsCount"></div>
        </div>

        <!-- Projects Grid -->
        <div class="projects-grid" id="projectsGrid"></div>

        <!-- Load More -->
        <div class="projects-load-more-wrapper">
            <button class="projects-load-more-btn" id="projectsLoadMore" type="button">
                Load More Projects <i class="fa-solid fa-chevron-down"></i>
            </button>
        </div>

        <!-- Back to Home -->
        <div class="projects-back-home">
            <a href="index.html" class="projects-back-link">
                <i class="fa-solid fa-arrow-left"></i> Back to Home
            </a>
        </div>

    </div>

    <!-- Data & Scripts -->
    <script src="projects-data.js"></script>
    <script src="projects-page.js"></script>
    <script src="script.js"></script>
</body>

</html>
